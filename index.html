<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Asistencia</title>

<link rel="icon" type="image/png" href="Icon2.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* === SIN CAMBIOS IMPORTANTES === */
:root{
--primary:#6366f1;
--accent:#06b6d4;
--success:#22c55e;
--danger:#ef4444;
--bg:linear-gradient(135deg,#eef2ff,#f8fafc);
--card:rgba(255,255,255,0.65);
--text:#0f172a;
--gray:#64748b;
}

body.dark{
--primary:#8b5cf6;
--accent:#22d3ee;
--success:#4ade80;
--danger:#f87171;
--bg:linear-gradient(135deg,#0f172a,#1e293b);
--card:rgba(30,41,59,0.75);
--text:#f1f5f9;
--gray:#94a3b8;
}

body{
font-family:'Segoe UI',sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:var(--card);
backdrop-filter:blur(35px);
max-width:620px;
width:100%;
padding:32px;
border-radius:28px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:14px;
margin-top:10px;
cursor:pointer;
}

.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;}
.secondary{background:#64748b;color:#fff;}
.danger{background:var(--danger);color:#fff;font-size:12px;padding:6px 10px;}
.edit{background:#f59e0b;color:#fff;font-size:12px;padding:6px 10px;margin-left:5px;}

.historial-item{
padding:12px;
margin-bottom:10px;
background:white;
border-radius:12px;
}

</style>
</head>

<body>

<div class="card">

<h2>Sistema de Asistencia</h2>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Virtual</label>
<input type="number" id="virtual">

<label>Presencial</label>
<input type="number" id="presencial">

<button class="primary" onclick="guardar()">Guardar</button>

<button class="secondary" onclick="mostrarLogin()">Admin</button>

<!-- ORDEN -->
<select id="orden" onchange="mostrar()">
<option value="desc">Más reciente</option>
<option value="asc">Más antiguo</option>
</select>

<div id="loginBox" style="display:none;">
<input id="usuario" placeholder="usuario">
<input id="password" type="password" placeholder="password">
<button onclick="login()">Entrar</button>
</div>

<div id="adminPanel" style="display:none;">
<button onclick="exportar()">Exportar</button>
</div>

<div id="historial"></div>

</div>

<script>

firebase.initializeApp({
apiKey:"AIzaSy...",
projectId:"sistema-asistencia-a47c9"
});

const db=firebase.firestore();

let adminActivo=false;
let editando=false;
let fechaEditando=null;

/* GUARDAR / EDITAR */
function guardar(){
const f=fecha.value || new Date().toISOString().split("T")[0];
const v=parseInt(virtual.value);
const p=parseInt(presencial.value);

if(isNaN(v)||isNaN(p)) return alert("Completa los datos");

db.collection("asistencia").doc(f).set({
virtual:v,
presencial:p
}).then(()=>{
editando=false;
fechaEditando=null;
limpiar();
mostrar();
});
}

function limpiar(){
fecha.value="";
virtual.value="";
presencial.value="";
}

/* MOSTRAR + ORDEN */
function mostrar(){
historial.innerHTML="";

db.collection("asistencia").get().then(snapshot=>{
let datos=[];

snapshot.forEach(doc=>{
datos.push({fecha:doc.id,...doc.data()});
});

const orden=ordenSelect();

datos.sort((a,b)=>{
return orden==="asc"
? new Date(a.fecha)-new Date(b.fecha)
: new Date(b.fecha)-new Date(a.fecha);
});

datos.forEach(d=>{
historial.innerHTML+=`
<div class="historial-item">
<strong>${d.fecha}</strong><br>
Virtual: ${d.virtual} | Presencial: ${d.presencial}
${adminActivo?`
<br>
<button class="edit" onclick="editar('${d.fecha}',${d.virtual},${d.presencial})">Editar</button>
<button class="danger" onclick="eliminar('${d.fecha}')">Eliminar</button>
`:""}
</div>`;
});

});
}

function ordenSelect(){
return document.getElementById("orden").value;
}

/* EDITAR */
function editar(f,v,p){
fecha.value=f;
virtual.value=v;
presencial.value=p;

editando=true;
fechaEditando=f;

window.scrollTo({top:0,behavior:"smooth"});
}

/* ELIMINAR */
function eliminar(f){
db.collection("asistencia").doc(f).delete().then(mostrar);
}

/* LOGIN */
function mostrarLogin(){
loginBox.style.display="block";
}

function login(){
db.collection("usuarios")
.where("usuario","==",usuario.value)
.where("password","==",password.value)
.get()
.then(snap=>{
if(!snap.empty){
adminActivo=true;
adminPanel.style.display="block";
loginBox.style.display="none";
mostrar();
}else alert("Error");
});
}

/* EXPORTAR */
function exportar(){
db.collection("asistencia").get().then(snapshot=>{
const datos={};
snapshot.forEach(doc=>datos[doc.id]=doc.data());

const blob=new Blob([JSON.stringify(datos)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="datos.txt";
a.click();
});
}

mostrar();

</script>

</body>
</html>
