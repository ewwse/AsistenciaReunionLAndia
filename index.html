<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Asistencia</title>

<link rel="icon" type="image/png" href="Icon2.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* (tus estilos intactos, no los toqué) */
</style>
</head>

<body>

<div class="card">

<div class="header">
<img src="Icon2.png">
<h1>Sistema de Asistencia</h1>
</div>

<label>Seleccionar Fecha</label>
<input type="date" id="fecha">

<label>Asistencia Virtual</label>
<input type="number" id="virtual">

<label>Asistencia Presencial</label>
<input type="number" id="presencial">

<button class="primary" onclick="guardar()">Guardar Asistencia</button>
<button class="secondary" onclick="mostrarLogin()">Zona Administrativa</button>

<div class="login-box" id="loginBox">
<input type="text" id="usuario" placeholder="Usuario">
<input type="password" id="password" placeholder="Contraseña">
<button class="primary" onclick="login()">Entrar</button>
</div>

<div class="admin-panel" id="adminPanel">

<button class="primary" onclick="exportar()">Descargar .txt</button>
<input type="file" accept=".txt,.json" onchange="importar(event)">

<label>Ordenar lista</label>
<select id="ordenLista" onchange="mostrar()">
<option value="desc">Más reciente primero</option>
<option value="asc">Más antiguo primero</option>
</select>

<label>Seleccionar Trimestre</label>
<select id="selectorTrimestre" onchange="actualizarGrafico()">
<option value="Q1">Enero - Marzo</option>
<option value="Q2">Abril - Junio</option>
<option value="Q3">Julio - Septiembre</option>
<option value="Q4">Octubre - Diciembre</option>
</select>

<canvas id="graficoPastel"></canvas>

</div>

<div class="historial" id="historial"></div>
</div>

<button class="theme-toggle" onclick="toggleDark()">
<span class="icon">🌙</span>
</button>

<script>
firebase.initializeApp({
apiKey:"AIzaSyBs3r8RFztg6NxUbkZmaSag2CxfF7phvG8",
authDomain:"sistema-asistencia-a47c9.firebaseapp.com",
projectId:"sistema-asistencia-a47c9"
});

const db=firebase.firestore();
let adminActivo=false;
let chart;
let datosTrimestre={Q1:{virtual:0,presencial:0},Q2:{virtual:0,presencial:0},Q3:{virtual:0,presencial:0},Q4:{virtual:0,presencial:0}};

if(localStorage.getItem("modo")==="dark"){
document.body.classList.add("dark");
document.querySelector(".icon").textContent="☀️";
}

function toggleDark(){
document.body.classList.toggle("dark");
const darkActivo=document.body.classList.contains("dark");
document.querySelector(".icon").textContent=darkActivo?"☀️":"🌙";
localStorage.setItem("modo",darkActivo?"dark":"light");
}

function guardar(){
const v=parseInt(virtual.value);
const p=parseInt(presencial.value);
let fechaSeleccionada=fecha.value||new Date().toISOString().split("T")[0];

if(isNaN(v)||isNaN(p)) return alert("Completa ambos campos");

db.collection("asistencia").doc(fechaSeleccionada)
.set({virtual:v,presencial:p})
.then(()=>{virtual.value="";presencial.value="";fecha.value="";mostrar();});
}

function mostrar(){
historial.innerHTML="";
datosTrimestre={Q1:{virtual:0,presencial:0},Q2:{virtual:0,presencial:0},Q3:{virtual:0,presencial:0},Q4:{virtual:0,presencial:0}};

db.collection("asistencia").get().then(snapshot=>{

let docs=[];
snapshot.forEach(doc=>{
docs.push({id:doc.id,data:doc.data()});
});

const orden=document.getElementById("ordenLista")?.value || "desc";

docs.sort((a,b)=>{
return orden==="asc"
? new Date(a.id)-new Date(b.id)
: new Date(b.id)-new Date(a.id);
});

docs.forEach(doc=>{
const fecha=doc.id;
const data=doc.data;
const mes=parseInt(fecha.split("-")[1]);
const q=mes<=3?"Q1":mes<=6?"Q2":mes<=9?"Q3":"Q4";

datosTrimestre[q].virtual+=Number(data.virtual);
datosTrimestre[q].presencial+=Number(data.presencial);

historial.innerHTML+=`
<div class="historial-item">
<strong>${fecha}</strong><br>
Virtual: ${data.virtual} | Presencial: ${data.presencial}
${adminActivo?`
<br>
<button class="secondary" onclick="editar('${fecha}',${data.virtual},${data.presencial})">Editar</button>
<button class="danger" onclick="eliminar('${fecha}')">Eliminar</button>
`:""}
</div>`;
});

if(adminActivo) actualizarGrafico();
});
}

function editar(fecha,vActual,pActual){
const nuevoV=prompt("Editar virtual:",vActual);
const nuevoP=prompt("Editar presencial:",pActual);

if(nuevoV===null||nuevoP===null) return;

const v=parseInt(nuevoV);
const p=parseInt(nuevoP);

if(isNaN(v)||isNaN(p)){
alert("Datos inválidos");
return;
}

db.collection("asistencia").doc(fecha)
.update({virtual:v,presencial:p})
.then(()=>mostrar());
}

function eliminar(fecha){
db.collection("asistencia").doc(fecha).delete().then(()=>mostrar());
}

function actualizarGrafico(){
const t=selectorTrimestre.value;
const v=datosTrimestre[t].virtual;
const p=datosTrimestre[t].presencial;
const total=v+p;

if(chart) chart.destroy();

chart=new Chart(graficoPastel,{
type:"bar",
data:{
labels:["Virtual","Presencial"],
datasets:[{
data:[v,p],
backgroundColor:["#6366f1","#22c55e"],
borderRadius:14
}]
},
options:{
plugins:{
legend:{display:false},
datalabels:{
anchor:"end",
align:"top",
font:{weight:"bold",size:14},
formatter:(value)=> total===0?"0%":((value*100)/total).toFixed(1)+"%"
}
}
},
plugins:[ChartDataLabels]
});
}

function mostrarLogin(){
loginBox.style.display="block";
}

function login(){
const user=usuario.value.trim();
const pass=password.value.trim();

db.collection("usuarios")
.where("usuario","==",user)
.where("password","==",pass)
.get()
.then(snapshot=>{
if(!snapshot.empty){
adminPanel.style.display="block";
loginBox.style.display="none";
adminActivo=true;
mostrar();
}else alert("Credenciales incorrectas");
});
}

/* EXPORTAR */
function exportar(){
db.collection("asistencia").get().then(snapshot=>{
const datos={};
snapshot.forEach(doc=>datos[doc.id]=doc.data());

const blob=new Blob([JSON.stringify(datos,null,2)]);
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="asistencia.txt";
a.click();
});
}

/* IMPORTAR */
function importar(e){
const archivo=e.target.files[0];
if(!archivo) return;

const reader=new FileReader();

reader.onload=async function(){
try{
const datos=JSON.parse(reader.result);
const batch=db.batch();

Object.keys(datos).forEach(fecha=>{
const ref=db.collection("asistencia").doc(fecha);
batch.set(ref,datos[fecha]);
});

await batch.commit();
alert("Importado correctamente");
mostrar();

}catch(err){
alert("Archivo inválido");
}
};

reader.readAsText(archivo);
}

mostrar();
</script>

</body>
</html>
